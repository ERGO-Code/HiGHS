# docker-compose.yml — HiGHS-Server 部署
#
# CPU 部署（默认）:  docker compose up
# GPU 部署:          docker compose --profile gpu up highs-server-gpu
#
# 需安装 NVIDIA Container Toolkit 才能用 GPU profile:
#   https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/install-guide.html

services:
  # CPU 版（默认启动）
  highs-server:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    image: highs-server:cpu
    ports:
      - "50051:50051"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "grpcurl -plaintext localhost:50051 list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # GPU 版（需 --profile gpu 显式启用）
  highs-server-gpu:
    profiles: ["gpu"]
    build:
      context: .
      dockerfile: Dockerfile.gpu
    image: highs-server:gpu
    ports:
      - "50051:50051"
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "grpcurl -plaintext localhost:50051 list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
