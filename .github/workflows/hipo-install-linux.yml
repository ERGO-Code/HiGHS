# Regression test for https://github.com/ERGO-Code/HiGHS/issues/3599:
# `cmake --install` must install the shared libhighs_extras.so, and the
# installed highs binary must run HiPO without the build tree present and
# without LD_LIBRARY_PATH.
name: hipo-install-linux

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hipo-install-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenBLAS
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev

      - name: Configure, build and install
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/install \
            -DHIPO=ON
          cmake --build build --parallel
          cmake --install build

      - name: Check libhighs_extras.so was installed
        run: |
          ls -l install/lib
          ls install/lib/libhighs_extras.so

      - name: Run installed highs with HiPO
        run: |
          # Remove the build tree so nothing can be loaded from it.
          rm -rf build
          out=$(install/bin/highs --solver hipo check/instances/afiro.mps 2>&1) || true
          echo "$out"
          echo "$out" | grep -Eq "Model status\s*:\s*Optimal"
