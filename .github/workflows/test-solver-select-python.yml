name: test-solver-select-python

# Minimal CI while iterating on solver-select: build highspy from source and
# run the focused python test for the solver_select_strategy /
# solver_select_require_basis options. The rest of the workflows are parked
# in .github/workflows-disabled/ — move them back (and delete this file)
# before merging.

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12"]

    steps:
      - uses: actions/checkout@v6

      - name: Install correct python version
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install build dependencies
        run: python -m pip install pytest

      - name: Build highspy
        run: python -m pip install .

      - name: Test solver select
        run: pytest -v check/test_solver_select_python.py
