name: test-clang-format

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - uses: DoozyX/clang-format-lint-action@v0.18
      with:
        source:
          'app/ highs/Highs.h ./highs/lp_data ./highs/mip ./highs/model ./highs/simplex ./highs/presolve ./highs/pdlp/hipdlp ./highs/simplex ./highs/util ./highs/qpsolver'
        extensions: 'h,cpp,c'
        clangFormatVersion: 18
