name: code-coverage

on: [pull_request]

jobs:
  debug:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04]

    steps:
      - uses: actions/checkout@v6

      - name: install
        run: sudo apt-get update && sudo apt-get install lcov

      - name: Create Build Environment
        run: cmake -E make_directory ${{github.workspace}}/build

      - name: Configure CMake
        shell: bash
        working-directory: ${{github.workspace}}/build
        run: |
          cmake $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=Debug \
                -DHIGHS_COVERAGE=ON \
                -DALL_TESTS=ON \
                -DBUILD_SHARED_LIBS=OFF \
                -D CMAKE_C_COMPILER=gcc \
                -D CMAKE_CXX_COMPILER=g++

      - name: Build
        working-directory: ${{github.workspace}}/build
        shell: bash
        run: |
          cmake --build . -j2

      - name: Test
        working-directory: ${{github.workspace}}/build
        shell: bash
        run: ctest --parallel --timeout 600 --output-on-failure

        # Coverage with HiPO will be different
      - name: Generate Report
        working-directory: ${{github.workspace}}/build
        shell: bash
        run: |
          lcov -d . -c -o cov.info --ignore-errors empty,inconsistent
          lcov --remove cov.info "/usr/include/*" "/usr/lib/*" \
            "extern/pdqsort/*" "extern/zstr/*" "extern/catch/*" "extern/cli11/*" \
            -o cov.info --ignore-errors inconsistent
          lcov --list cov.info --ignore-errors inconsistent
          mv cov.info coverage.info

      - name: Genhtml Results Summary
        working-directory: ${{github.workspace}}/build
        shell: bash
        run: |
          genhtml -o coverage coverage.info --ignore-errors inconsistent

      # Made it past the first token issue.
      # May need some more time to porpagate on the codecov side.
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ERGO-Code/HiGHS
          fail_ci_if_error: true # optional (default = false)
          files: ${{github.workspace}}/build/coverage.info # optional
          # name: codecov-umbrella # optional
          verbose: true # optional (default = false)
