name: build-intel

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Add oneAPI to apt
        shell: bash
        run: |
          wget -O- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" \
            | sudo tee /etc/apt/sources.list.d/oneAPI.list

      - name: Install oneAPI basekit
        shell: bash
        run: |
          sudo apt update
          sudo apt install intel-basekit

      - name: Check compiler
        run: |
          source /opt/intel/oneapi/setvars.sh
          icpx --version
          icx --version

      - name: Configure
        shell: bash
        run: |
          source /opt/intel/oneapi/setvars.sh
          cmake -S . -B build \
          -DCMAKE_BUILD_TYPE="RelWithDebInfo" \
          -DCMAKE_INSTALL_PREFIX=install \
          -DCMAKE_CXX_COMPILER=icpx \
          -DCMAKE_C_COMPILER=icx \
          -DALL_TESTS=ON \
          -DIntelDPCPP_DIR="/opt/intel/oneapi/compiler/latest/linux/cmake/SYCL" \

      - name: Build
        shell: bash
        run: |
          source /opt/intel/oneapi/setvars.sh
          cmake --build build --parallel

      # If the unit tests below are failing run to see details.
      # - name: Unit Test
      #   shell: bash
      #   run: |
      #     source /opt/intel/oneapi/setvars.sh
      #     export SYCL_DEVICE_FILTER=opencl.cpu
      #     pwd
      #     ls
      #     ls build
      #     ls build/bin
      #     ./build/bin/unit_tests

      - name: Test
        shell: bash
        run: |
          source /opt/intel/oneapi/setvars.sh
          export SYCL_DEVICE_FILTER=opencl.cpu
          ctest --test-dir build --output-on-failure --timeout 300

  build_windows:
    runs-on: windows-2022
    env:
      # Installer URL and components follow https://github.com/oneapi-src/oneapi-ci
      WINDOWS_TOOLKIT_URL: https://registrationcenter-download.intel.com/akdlm/IRC_NAS/728c4418-1b40-47a9-ad51-31530fb27c94/intel-oneapi-toolkit-2026.2.0.661_offline.exe
      WINDOWS_CPP_COMPONENTS: intel.oneapi.win.cpp-dpcpp-common
      ONEAPI_ROOT: C:\Program Files (x86)\Intel\oneAPI

    steps:
      - uses: actions/checkout@v6

      - name: Cache oneAPI install
        id: cache-install
        uses: actions/cache@v4
        with:
          path: |
            C:\Program Files (x86)\Intel\oneAPI\setvars-vcvarsall.bat
            C:\Program Files (x86)\Intel\oneAPI\compiler
          key: oneapi-${{ env.WINDOWS_TOOLKIT_URL }}-${{ env.WINDOWS_CPP_COMPONENTS }}

      - name: Install oneAPI C++ compiler
        if: steps.cache-install.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          curl.exe --output %TEMP%\oneapi.exe --url %WINDOWS_TOOLKIT_URL% --retry 5 --retry-delay 5 || exit /b 1
          start /b /wait %TEMP%\oneapi.exe -s -x -f oneapi_extracted --log extract.log
          del %TEMP%\oneapi.exe
          oneapi_extracted\bootstrapper.exe -s --action install --components=%WINDOWS_CPP_COMPONENTS% --eula=accept -p=NEED_VS2017_INTEGRATION=0 -p=NEED_VS2019_INTEGRATION=0 -p=NEED_VS2022_INTEGRATION=0 --log-dir=. || exit /b 1
          rd /s/q oneapi_extracted

      - name: Configure, build and test
        shell: cmd
        run: |
          call "%ONEAPI_ROOT%\setvars-vcvarsall.bat" vs2022 || exit /b 1
          for /f "tokens=* usebackq" %%f in (`dir /b "%ONEAPI_ROOT%\compiler\" ^| findstr /V latest ^| sort`) do @set "LATEST_VERSION=%%f"
          call "%ONEAPI_ROOT%\compiler\%LATEST_VERSION%\env\vars.bat" || exit /b 1
          icx --version || exit /b 1
          cmake -S . -B build -G Ninja ^
            -DCMAKE_BUILD_TYPE=RelWithDebInfo ^
            -DCMAKE_C_COMPILER=icx ^
            -DCMAKE_CXX_COMPILER=icx ^
            -DALL_TESTS=ON || exit /b 1
          cmake --build build --parallel || exit /b 1
          ctest --test-dir build --output-on-failure --timeout 300 || exit /b 1
