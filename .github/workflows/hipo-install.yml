# Regression test for https://github.com/ERGO-Code/HiGHS/issues/3599:
# `cmake --install` must install the shared highs_extras library, and the
# installed highs binary must run HiPO without the build tree present and
# without LD_LIBRARY_PATH / DYLD_LIBRARY_PATH. The python job checks the same
# for pip-installed highspy + highspy-extras, run from outside the checkout.
name: hipo-install

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hipo-install:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenBLAS (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev

      # macOS uses the default BLAS (Apple Accelerate), no install needed.

      - name: Install OpenBLAS (Windows)
        if: runner.os == 'Windows'
        run: vcpkg install openblas[threads]:x64-windows-static

      - name: Configure, build and install (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/install \
            -DHIPO=ON
          cmake --build build --parallel
          cmake --install build

      - name: Configure, build and install (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Pin the static triplet so highs_extras.dll does not depend on an
          # openblas.dll that is never installed (see hipo-install-extras.yml).
          cmake -S . -B build `
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DCMAKE_INSTALL_PREFIX="$env:GITHUB_WORKSPACE/install" `
            -DHIPO=ON
          cmake --build build --parallel --config Release
          cmake --install build --config Release

      - name: Check highs_extras was installed
        shell: bash
        run: |
          ls -l install/lib install/bin
          case "$RUNNER_OS" in
            Linux)   ls install/lib/libhighs_extras.so ;;
            macOS)   ls install/lib/libhighs_extras*.dylib ;;
            Windows) ls install/bin/highs_extras.dll ;;
          esac

      - name: Run installed highs with HiPO
        shell: bash
        run: |
          # Remove the build tree so nothing can be loaded from it.
          rm -rf build
          out=$(install/bin/highs --solver hipo check/instances/afiro.mps 2>&1) || true
          echo "$out"
          echo "$out" | grep -Eq "Model status\s*:\s*Optimal"

  hipo-install-python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install highspy and highspy-extras
        run: |
          python -m pip install ./highspy-extras
          python -m pip install .

      - name: Run HiPO from outside the checkout
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          MODEL: ${{ github.workspace }}/check/instances/afiro.mps
        run: |
          python - <<'EOF'
          import os, highspy
          h = highspy.Highs()
          h.setOptionValue("solver", "hipo")
          h.readModel(os.environ["MODEL"])
          h.run()
          status = h.getModelStatus()
          print("highspy from", highspy.__file__, "->", h.modelStatusToString(status))
          assert status == highspy.HighsModelStatus.kOptimal
          EOF
