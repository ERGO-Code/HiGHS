name: sanitizers-cmake

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gcc:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        config: [Debug, RelWithDebInfo]
        sanitizer: [Address, Thread, Leak]
    steps:
      - uses: actions/checkout@v6

      - name: Create Build Environment
        run: cmake -E make_directory ${{github.workspace}}/build

      - name: Configure CMake and Build
        shell: bash
        working-directory: ${{github.workspace}}/build
        run: |
          # libstdc++ only annotates std::vector for ASan container-overflow
          # detection when _GLIBCXX_SANITIZE_VECTOR is defined
          EXTRA_FLAGS=""
          if [ "${{ matrix.sanitizer }}" = "Address" ]; then
            EXTRA_FLAGS="-DCMAKE_CXX_FLAGS=-D_GLIBCXX_SANITIZE_VECTOR"
          fi
          cmake $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DDEBUG_MEMORY=${{ matrix.sanitizer }} -DALL_TESTS=ON -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ $EXTRA_FLAGS
          cmake --build . -j2

      - name: Run
        working-directory: ${{github.workspace}}/build
        shell: bash
        run: ./bin/highs $GITHUB_WORKSPACE/check/instances/afiro.mps

      - name: Test
        working-directory: ${{github.workspace}}/build
        shell: bash
        run: ctest --parallel --timeout 3000 --output-on-failure

  clang:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # os: [ubuntu-latest, macos-latest]
        os: [ubuntu-latest]
        config: [Debug, RelWithDebInfo]
        sanitizer: [Address, Thread, Leak]
    steps:
      - uses: actions/checkout@v6

      - name: Create Build Environment
        run: cmake -E make_directory ${{github.workspace}}/build

      - name: Configure CMake and Build
        shell: bash
        working-directory: ${{github.workspace}}/build
        run: |
          # libstdc++ only annotates std::vector for ASan container-overflow
          # detection when _GLIBCXX_SANITIZE_VECTOR is defined
          EXTRA_FLAGS=""
          if [ "${{ matrix.sanitizer }}" = "Address" ]; then
            EXTRA_FLAGS="-DCMAKE_CXX_FLAGS=-D_GLIBCXX_SANITIZE_VECTOR"
          fi
          cmake $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DDEBUG_MEMORY=${{ matrix.sanitizer }} -DALL_TESTS=ON -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ $EXTRA_FLAGS
          cmake --build . -j2

      - name: Run
        working-directory: ${{github.workspace}}/build
        shell: bash
        run: ./bin/highs $GITHUB_WORKSPACE/check/instances/afiro.mps

      - name: Test
        working-directory: ${{github.workspace}}/build
        shell: bash
        run: ctest --parallel --timeout 3000 --output-on-failure

  no_hipo_macos:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        config: [Debug, RelWithDebInfo]
        sanitizer: [Address, Thread]
    steps:
      - uses: actions/checkout@v6

      - name: Create Build Environment
        run: cmake -E make_directory ${{github.workspace}}/build

      - name: Configure CMake and Build
        shell: bash
        working-directory: ${{github.workspace}}/build
        run: |
          cmake $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DDEBUG_MEMORY=${{ matrix.sanitizer }} -DALL_TESTS=ON
          cmake --build . -j3

      - name: Run
        working-directory: ${{github.workspace}}/build
        shell: bash
        run: ./bin/highs $GITHUB_WORKSPACE/check/instances/afiro.mps

      - name: Test
        working-directory: ${{github.workspace}}/build
        shell: bash
        run: ctest --parallel --timeout 3000 --output-on-failure

  hipo:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        config: [Debug, RelWithDebInfo]
        all_tests: [ON]
        sanitizer: [Address, Thread, Leak]

    steps:
      - uses: actions/checkout@v6

      - name: Create Build Environment
        run: cmake -E make_directory ${{github.workspace}}/build

      - name: Configure CMake
        working-directory: ${{github.workspace}}/build
        shell: bash
        run: |
          # libstdc++ only annotates std::vector for ASan container-overflow
          # detection when _GLIBCXX_SANITIZE_VECTOR is defined
          EXTRA_FLAGS=""
          if [ "${{ matrix.sanitizer }}" = "Address" ]; then
            EXTRA_FLAGS="-DCMAKE_CXX_FLAGS=-D_GLIBCXX_SANITIZE_VECTOR"
          fi
          cmake $GITHUB_WORKSPACE -DHIPO=ON -DBUILD_OPENBLAS=ON $EXTRA_FLAGS \
            -DALL_TESTS=${{ matrix.all_tests }} \
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
            -DDEBUG_MEMORY=${{ matrix.sanitizer }} \
            -DNO_AVX512=ON \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF \
            -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++


      - name: Build
        working-directory: ${{github.workspace}}/build
        run: |
          cmake --build . -j2

      - name: Test executable
        working-directory: ${{github.workspace}}/build
        run: ./bin/highs --solver=hipo $GITHUB_WORKSPACE/check/instances/afiro.mps

      - name: Test
        working-directory: ${{github.workspace}}/build
        run: ctest --parallel --timeout 3000 --output-on-failure

  hipo_macos:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        config: [Debug, RelWithDebInfo]
        sanitizer: [Address, Thread]

    steps:
      - uses: actions/checkout@v6

      - name: Create Build Environment
        run: cmake -E make_directory ${{github.workspace}}/build

      - name: Configure CMake
        working-directory: ${{github.workspace}}/build
        run: |
          cmake $GITHUB_WORKSPACE -DHIPO=ON \
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
            -DDEBUG_MEMORY=${{ matrix.sanitizer }} \
            -DALL_TESTS=ON

      - name: Build
        working-directory: ${{github.workspace}}/build
        run: |
          cmake --build . -j3

      - name: Test executable
        working-directory: ${{github.workspace}}/build
        run: ./bin/highs --solver=hipo $GITHUB_WORKSPACE/check/instances/afiro.mps

      - name: Test
        working-directory: ${{github.workspace}}/build
        # run: ctest --parallel --timeout 3000 --output-on-failure
        run: |
          ./bin/unit_tests [highs_hipo] dominated-cols-container-overflow
