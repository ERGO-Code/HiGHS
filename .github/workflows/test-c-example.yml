# This tests the C example, and it uses a similar build script to the one used
# by JuMP when building HiGHS:
# https://github.com/JuliaPackaging/Yggdrasil/blob/master/H/HiGHS/build_tarballs.jl
name: test-c-example

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Create Build Environment
        run: |
          mkdir build
          mkdir installs
      - name: Build HiGHS library
        shell: bash
        working-directory: build
        run: |
          cmake \
            -DCMAKE_INSTALL_PREFIX=../installs/highs \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DFAST_BUILD=ON \
            $GITHUB_WORKSPACE
          cmake --build . --config Release --parallel
          make install
      - name: Compile and test C example
        shell: bash
        run: |
          gcc -Wall -Werror $GITHUB_WORKSPACE/examples/call_highs_from_c.c \
            -o c_example \
            -I installs/highs/include/highs \
            -L installs/highs/lib -lhighs
          LD_LIBRARY_PATH=installs/highs/lib ./c_example
      # Consumers such as SciPy build HiGHS headers with -Wall -Werror (#3612)
      - name: Check public headers compile without warnings
        shell: bash
        run: |
          printf '#include "Highs.h"\n#include "HighsExternalApi.h"\n#include "interfaces/highs_c_api.h"\n' > headers.cpp
          g++ -std=c++11 -Wall -Werror -c headers.cpp -o /dev/null \
            -I build -I $GITHUB_WORKSPACE/highs -I $GITHUB_WORKSPACE/extern

  fast-build-off:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Create Build Environment
        run: |
          mkdir build
          mkdir installs
      - name: Build HiGHS library
        shell: bash
        working-directory: build
        run: |
          cmake \
            -DCMAKE_INSTALL_PREFIX=../installs/highs \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DFAST_BUILD=OFF \
            $GITHUB_WORKSPACE
          cmake --build . --config Release --parallel
          make install
      - name: Compile and test C example
        shell: bash
        run: |
          gcc $GITHUB_WORKSPACE/examples/call_highs_from_c.c \
            -o c_example \
            -I installs/highs/include/highs \
            -L installs/highs/lib -lhighs
          LD_LIBRARY_PATH=installs/highs/lib ./c_example
