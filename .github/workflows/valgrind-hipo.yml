name: valgrind-hipo

on: [pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit_tests:
    name: unit_tests (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Must be one more than the number of SLOW_GROUPS in the Test step.
        shard: [0, 1, 2]

    steps:
      - uses: actions/checkout@v6

      - name: Install Valgrind
        run: sudo apt-get update && sudo apt-get install valgrind

      - name: Create Build Environment
        run: cmake -E make_directory ${{github.workspace}}/build

      - name: Configure CMake
        shell: bash
        working-directory: ${{github.workspace}}/build
        run: |
          cmake $GITHUB_WORKSPACE -DHIPO=ON \
          -DBUILD_OPENBLAS=ON \
          -DNO_AVX512=ON \
          -DCMAKE_BUILD_TYPE=Debug \
          -DALL_TESTS=ON \
          -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF

      - name: Build
        working-directory: ${{github.workspace}}/build
        shell: bash
        run: |
          cmake --build . -j2

      - name: Test
        working-directory: ${{github.workspace}}/build
        shell: bash
        run: |
          # Shards 0..N-2 run the slow test files named below (Catch filename tags);
          # the last shard runs every other file, so new test files are always covered.
          SLOW_GROUPS=("TestMipSolver" "TestSymmetry TestCallbacks TestIis")
          SHARD=${{ matrix.shard }}
          if [ ${{ strategy.job-total }} -ne $(( ${#SLOW_GROUPS[@]} + 1 )) ]; then
            echo "matrix.shard must have $(( ${#SLOW_GROUPS[@]} + 1 )) entries"; exit 1
          fi
          if [ $SHARD -lt ${#SLOW_GROUPS[@]} ]; then
            SPEC=$(printf '[#%s],' ${SLOW_GROUPS[$SHARD]}); SPEC=${SPEC%,}
          else
            SPEC=$(printf '~[#%s]' ${SLOW_GROUPS[*]})
          fi
          echo "Running unit tests: $SPEC"
          valgrind \
          --leak-check=full \
          --show-leak-kinds=all \
          --track-origins=yes \
          -s \
          ./bin/unit_tests -# "$SPEC" \
          2>&1 | tee logfile

      - name: Check log for Errors
        working-directory: ${{github.workspace}}/build
        shell: bash
        run: |
          cat logfile
          OUTPUT='ERROR SUMMARY: 0 errors from 0 contexts (suppressed: 0 from 0)'
          if grep -q "$OUTPUT" logfile; then
            exit 0
          fi
          exit 1

  instance_tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v6

      - name: Install Valgrind
        run: sudo apt-get update && sudo apt-get install valgrind

      - name: Create Build Environment
        run: cmake -E make_directory ${{github.workspace}}/build

      - name: Configure CMake
        shell: bash
        working-directory: ${{github.workspace}}/build
        run: |
          cmake $GITHUB_WORKSPACE -DHIPO=ON \
          -DBUILD_OPENBLAS=ON \
          -DNO_AVX512=ON \
          -DCMAKE_BUILD_TYPE=Debug \
          -DALL_TESTS=ON \
          -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF

      - name: Build
        working-directory: ${{github.workspace}}/build
        shell: bash
        run: |
          cmake --build . -j2

      - name: Test
        working-directory: ${{github.workspace}}/build
        shell: bash
        run: |
          valgrind \
          --leak-check=full \
          --show-leak-kinds=all \
          --track-origins=yes \
          -s \
          ctest -E unit.* \
          --timeout 1000 \
          --output-on-failure \
          2>&1 | tee logfile2

      - name: Check log for Errors
        working-directory: ${{github.workspace}}/build
        shell: bash
        run: |
          cat logfile2
          OUTPUT='ERROR SUMMARY: 0 errors from 0 contexts (suppressed: 0 from 0)'
          if grep -q "$OUTPUT" logfile2; then
            exit 0
          fi
          exit 1

  examples:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v6

      - name: Install Valgrind
        run: sudo apt-get update && sudo apt-get install valgrind

      - name: Create Build Environment
        run: cmake -E make_directory ${{github.workspace}}/build

      - name: Configure CMake
        shell: bash
        working-directory: ${{github.workspace}}/build
        run: |
          cmake $GITHUB_WORKSPACE -DHIPO=ON \
          -DBUILD_OPENBLAS=ON \
          -DNO_AVX512=ON \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF

      - name: Build
        working-directory: ${{github.workspace}}/build
        shell: bash
        run: |
          cmake --build . -j2

      - name: Test cpp example
        working-directory: ${{github.workspace}}/build
        shell: bash
        run: |
          valgrind \
          --leak-check=full \
          --show-leak-kinds=all \
          --track-origins=yes \
          -s \
          ./bin/call_highs_from_cpp \
          --timeout 1000 \
          --output-on-failure \
          2>&1 | tee logfile2

      - name: Check log for Errors
        working-directory: ${{github.workspace}}/build
        shell: bash
        run: |
          cat logfile2
          OUTPUT='ERROR SUMMARY: 0 errors from 0 contexts (suppressed: 0 from 0)'
          if grep -q "$OUTPUT" logfile2; then
            exit 0
          fi
          exit 1

      - name: Test C example
        working-directory: ${{github.workspace}}/build
        shell: bash
        run: |
          valgrind \
          --leak-check=full \
          --show-leak-kinds=all \
          --track-origins=yes \
          -s \
          ./bin/call_highs_from_c_minimal \
          --timeout 1000 \
          --output-on-failure \
          2>&1 | tee logfile2

      - name: Check log for Errors
        working-directory: ${{github.workspace}}/build
        shell: bash
        run: |
          cat logfile2
          OUTPUT='ERROR SUMMARY: 0 errors from 0 contexts (suppressed: 0 from 0)'
          if grep -q "$OUTPUT" logfile2; then
            exit 0
          fi
          exit 1